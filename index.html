          "name": "Can Clubnizer handle membership fees and payments?",

          }
        },
        {
          "@type": "Question",
          "name": "Is Clubnizer GDPR compliant?",
          "acceptedAnswer": {
            "@type": "Answer",

          }
        },
        {
          "@type": "Question",
          "name": "Does Clubnizer work for youth sports clubs?",
          "acceptedAnswer": {

          }
        },
